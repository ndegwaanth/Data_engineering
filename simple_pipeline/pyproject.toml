[project]
name = "simple-pipeline"
version = "0.1.0"
description = "Simple data cleaning pipeline"
readme = "README.md"
authors = [
    { name = "Anthony Ndegwa", email = "ndegwaanthony300@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
simple-pipeline = "simple_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pgcli>=4.7.1",
]
