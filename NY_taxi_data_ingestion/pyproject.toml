[project]
name = "ny-taxi-data-ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anthony Ndegwa", email = "ndegwaanthony300@gmail.com" }
]
requires-python = ">=3.12.2"
dependencies = [
    "click>=8.5.1",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "sqlalchemy>=2.1.8",
    "tqdm>=4.70.1",
]

[project.scripts]
ny-taxi-data-ingestion = "ny_taxi_data_ingestion:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pgcli>=4.7.1",
    "psycopg[binary,pool]>=3.3.8",
    "sqlalchemy>=2.1.8",
]
